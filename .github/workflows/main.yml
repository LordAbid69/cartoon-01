name: Render video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file name (empty = auto-detect the file that uses Remotion)"
        required: false
        default: ""
      max_shards:
        description: "Max parallel render jobs (1-20)"
        required: false
        default: "20"
      chunk_seconds:
        description: "Seconds per render chunk"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    env:
      CND_DIR: ${{ github.workspace }}/cnd
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 rsync

      - name: Python dependencies
        run: |
          pip install numpy rich
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Locate script and assets
        shell: bash
        env:
          SCRIPT_IN: ${{ inputs.script }}
        run: |
          set +e
          echo "Repo root files:"; git ls-files | grep -v /
          S="$SCRIPT_IN"
          if [ -z "$S" ]; then
            S="$(git ls-files | grep -v / | grep -i -E '\.(py|js|mjs|cjs|ts)$' | while IFS= read -r f; do grep -Iq -i remotion "$f" && echo "$f"; done | sed -n '1p')"
          fi
          if [ -z "$S" ] || [ ! -f "$S" ]; then
            echo "::error::No script found. Upload your script to the repo root (or type its exact name when running the workflow)."
            exit 1
          fi
          echo "Using script: $S"
          echo "SCRIPT=$S" >> "$GITHUB_ENV"
          mkdir -p cnd
          # copy every root asset next to where the script expects its output dir
          git ls-files | grep -v / | grep -i -E '\.(mp3|wav|m4a|aac|ogg|flac|mp4|mov|png|jpg|jpeg|gif|webp|svg|ttf|otf|woff2?|json|csv|txt)$' | while IFS= read -r f; do
            cp "$f" cnd/
            case "$f" in
              *.mp3|*.wav|*.m4a|*.aac|*.ogg|*.flac)
                echo "Audio: $f | $(ls -l "$f" | awk '{print $5}') bytes | $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f") s";;
            esac
          done
          exit 0

      - name: Run script (builds the Remotion project, rendering is skipped)
        shell: bash
        run: |
          set +e
          python3 - <<'EOF'
          import os, re
          s = open(os.environ["SCRIPT"], encoding="utf-8", errors="replace").read()
          target = os.environ["CND_DIR"]
          pat = re.compile(r"""[rRuUbBfF]*(["'])[A-Za-z]:[\\/][^"'\r\n]*\1""")
          def rep(m):
              lit = m.group(0)
              q = m.group(1)
              inner = lit[lit.index(q) + 1 : -1]
              last = re.split(r"[\\/]", inner)[-1]
              if re.search(r"\.[A-Za-z0-9]{2,5}$", last):
                  return "r" + q + target + "/" + last + q
              return "r" + q + target + q
          out, n = pat.subn(rep, s)
          open("patched_script.py", "w", encoding="utf-8").write(out)
          print("Windows paths replaced:", n)
          EOF
          mkdir -p shim

          # ---- npx shim: skip remotion render
          cat > shim/npx <<'EOF'
          #!/bin/bash
          HAS_R=0; HAS_REM=0; OUTF=""
          for a in "$@"; do
            [ "$a" = "render" ] && HAS_R=1
            [ "$a" = "remotion" ] && HAS_REM=1
            case "$a" in *.mp4|*.mov|*.webm|*.mkv|*.gif) OUTF="$a";; esac
          done
          if [ "$HAS_R" = 1 ] && [ "$HAS_REM" = 1 ]; then
            echo "[shim] npx remotion render skipped"
            if [ -n "$OUTF" ]; then mkdir -p "$(dirname "$OUTF")"; : > "$OUTF"; fi
            exit 0
          fi
          exec "$REAL_NPX" "$@"
          EOF

          # ---- node shim: skip render scripts
          cat > shim/node <<'EOF'
          #!/bin/bash
          case "$1" in
            *render*.mjs|*render*.cjs|*render*.js)
              echo "[shim] node render skipped ($1)"
              echo "ALLDONE"
              exit 0
              ;;
          esac
          exec "$REAL_NODE" "$@"
          EOF

          # ---- ffmpeg shim: auto-repair sidechaincompress format failures
          cat > shim/ffmpeg <<'EOF'
          #!/usr/bin/env python3
          import os, re, subprocess, sys
          real = os.environ["REAL_FFMPEG"]
          args = sys.argv[1:]
          r = subprocess.run([real] + args)
          if r.returncode == 0 or not any("sidechaincompress" in a for a in args):
              sys.exit(r.returncode)
          F = "sample_fmts=fltp:sample_rates=44100:channel_layouts=stereo"
          pat = re.compile(r"\[(\w+)\]\[(\w+)\]sidechaincompress=([^\[;]*)\[(\w+)\]")
          def fixA(a):
              return pat.sub(lambda m: "[%s]aformat=%s[%sx];[%s]aformat=%s[%sx];[%sx][%sx]sidechaincompress=%s[%s]" % (
                  m.group(1), F, m.group(1), m.group(2), F, m.group(2), m.group(1), m.group(2), m.group(3), m.group(4)), a)
          def fixB(a):
              return pat.sub(lambda m: "[%s]anullsink;[%s]anull[%s]" % (m.group(2), m.group(1), m.group(4)), a)
          for name, fn in (("aformat", fixA), ("no-ducking", fixB)):
              sys.stderr.write("[ffmpeg shim] retry with %s fix\n" % name)
              r = subprocess.run([real] + [fn(a) for a in args])
              if r.returncode == 0:
                  sys.exit(0)
          sys.exit(r.returncode)
          EOF

          chmod +x shim/npx shim/node shim/ffmpeg
          export REAL_NPX="$(command -v npx)"
          export REAL_NODE="$(command -v node)"
          export REAL_FFMPEG="$(command -v ffmpeg)"
          FLAGS=""
          if grep -q -- '"--prep-only"' "$SCRIPT"; then FLAGS="--prep-only"
          elif grep -q -- '"--prep"' "$SCRIPT"; then FLAGS="--prep"; fi
          echo "Running: python3 patched_script.py $FLAGS"
          PATH="$PWD/shim:$PATH" python3 -u patched_script.py $FLAGS 2>&1 | tee prep.log | tail -n 60
          exit 0

      - name: Collect generated project
        shell: bash
        run: |
          set +e
          # 1) package.json that mentions remotion, outside node_modules/.git
          PJ="$(find . -type f -name package.json -not -path '*/node_modules/*' -not -path './.git/*' -not -path './project/*' | while IFS= read -r f; do grep -q '"remotion"' "$f" && echo "$f"; done | awk '{print length, $0}' | sort -n | sed -n '1p' | cut -d' ' -f2-)"
          P=""
          if [ -n "$PJ" ]; then P="$(dirname "$PJ")"; fi
          # 2) fallback: folder holding the file that calls registerRoot(
          if [ -z "$P" ]; then
            RR="$(grep -rl --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' 'registerRoot(' . 2>/dev/null | grep -v node_modules | grep -v '^./.git/' | sed -n '1p')"
            if [ -n "$RR" ]; then
              D="$(dirname "$RR")"
              while [ "$D" != "." ] && [ ! -f "$D/package.json" ]; do D="$(dirname "$D")"; done
              P="$D"
              [ "$P" = "." ] && P="$(dirname "$RR")"
            fi
          fi
          if [ -z "$P" ]; then
            echo "::error::The script did not generate a Remotion project. Last log lines:"
            tail -n 60 prep.log
            exit 1
          fi
          echo "Project dir: $P"
          mkdir -p project
          rsync -a --exclude node_modules --exclude .git --exclude project --exclude chunks "$P"/ project/
          ls -la project

      - name: Install dependencies, write helpers, plan chunks
        id: plan
        shell: bash
        working-directory: project
        env:
          MAX_SHARDS: ${{ inputs.max_shards }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
        run: |
          set -e
          [ -f package.json ] || echo '{"name":"proj","version":"1.0.0","private":true}' > package.json
          if ! grep -q '"remotion"' package.json; then
            npm install --save --no-audit --no-fund --loglevel=error remotion@^4 @remotion/bundler@^4 @remotion/renderer@^4 @remotion/cli@^4 react@18 react-dom@18
          else
            npm install --no-audit --no-fund --loglevel=error
          fi
          VER="$(node -p "require('./node_modules/remotion/package.json').version")"
          echo "Remotion version: $VER"
          npm install --save --no-audit --no-fund --loglevel=error "@remotion/bundler@$VER" "@remotion/renderer@$VER"

          # entry point: file that calls registerRoot(
          ENTRY="$(grep -rl --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' 'registerRoot(' . 2>/dev/null | grep -v node_modules | sed -n '1p' | sed 's|^\./||')"
          if [ -z "$ENTRY" ]; then
            for f in src/index.ts src/index.tsx src/index.js src/index.jsx index.ts index.tsx index.js index.jsx; do
              [ -f "$f" ] && ENTRY="$f" && break
            done
          fi
          [ -n "$ENTRY" ] || { echo "::error::No Remotion entry file (registerRoot) found"; exit 1; }
          echo "Entry: $ENTRY"
          echo "$ENTRY" > entry.txt

          cat > plan.js <<'EOF'
          const fs=require('fs'),path=require('path');
          const {bundle}=require('@remotion/bundler');
          const R=require('@remotion/renderer');
          (async()=>{
           const entry=fs.readFileSync('entry.txt','utf8').trim();
           try{await R.ensureBrowser();}catch(e){console.log('ensureBrowser:',e.message);}
           const opts={entryPoint:path.resolve(entry)};
           if(fs.existsSync('public'))opts.publicDir=path.resolve('public');
           const serveUrl=await bundle(opts);
           const comps=await R.getCompositions(serveUrl);
           if(!comps.length)throw new Error('No compositions found');
           const c=comps.find(x=>x.id===process.env.COMP_ID)||comps[0];
           const cs=Math.max(1,parseFloat(process.env.CHUNK_SECONDS||'2')||2);
           const chunk=Math.max(1,Math.round(c.fps*cs));
           const plan={entry,id:c.id,fps:c.fps,width:c.width,height:c.height,total:c.durationInFrames,chunk,n:Math.ceil(c.durationInFrames/chunk)};
           fs.writeFileSync('plan.json',JSON.stringify(plan));
           console.log('PLAN '+JSON.stringify(plan));
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF

          cat > shard.js <<'EOF'
          const fs=require('fs'),path=require('path'),os=require('os');
          const {bundle}=require('@remotion/bundler');
          const {selectComposition,renderMedia}=require('@remotion/renderer');
          (async()=>{
           const plan=JSON.parse(fs.readFileSync('plan.json','utf8'));
           const SHARD=+(process.env.SHARD||0),SHARDS=+(process.env.SHARDS||1);
           fs.mkdirSync('chunks',{recursive:true});
           const opts={entryPoint:path.resolve(plan.entry)};
           if(fs.existsSync('public'))opts.publicDir=path.resolve('public');
           const serveUrl=await bundle(opts);
           const composition=await selectComposition({serveUrl,id:plan.id});
           let mine=0,done=0;
           for(let i=0;i<plan.n;i++)if(i%SHARDS===SHARD)mine++;
           console.log('Shard '+SHARD+' of '+SHARDS+' renders '+mine+' chunks');
           for(let i=0;i<plan.n;i++){
            if(i%SHARDS!==SHARD)continue;
            const a=i*plan.chunk,b=Math.min(plan.total-1,a+plan.chunk-1);
            const name=path.join('chunks','part_'+String(i).padStart(4,'0')+'.mp4');
            if(fs.existsSync(name)){done++;console.log('SKIP '+name);continue;}
            const tmp=name.replace(/\.mp4$/,'.tmp.mp4');
            let last=0;
            await renderMedia({composition,serveUrl,codec:'h264',crf:21,pixelFormat:'yuv420p',imageFormat:'jpeg',jpegQuality:95,muted:true,frameRange:[a,b],outputLocation:tmp,concurrency:os.cpus().length,
             onProgress:({renderedFrames})=>{if(renderedFrames-last>=30){last=renderedFrames;console.log('chunk '+i+': '+renderedFrames+'/'+(b-a+1)+' frames');}}});
            fs.renameSync(tmp,name);done++;
            console.log('DONE chunk '+i+' ('+done+'/'+mine+')');
           }
           console.log('SHARD COMPLETE');
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF

          cat > audio.js <<'EOF'
          const fs=require('fs'),path=require('path');
          const {bundle}=require('@remotion/bundler');
          const {selectComposition,renderMedia}=require('@remotion/renderer');
          (async()=>{
           const plan=JSON.parse(fs.readFileSync('plan.json','utf8'));
           const opts={entryPoint:path.resolve(plan.entry)};
           if(fs.existsSync('public'))opts.publicDir=path.resolve('public');
           const serveUrl=await bundle(opts);
           const composition=await selectComposition({serveUrl,id:plan.id});
           await renderMedia({composition,serveUrl,codec:'wav',outputLocation:'audio.wav'});
           console.log('AUDIO DONE');
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF

          node plan.js
          node -e "const p=require('./plan.json');const s=p.total/p.fps;console.log('Composition '+p.id+': '+p.width+'x'+p.height+' @ '+p.fps+' fps, '+p.total+' frames = '+s.toFixed(2)+' s, '+p.n+' chunks');if(s<3){console.log('::error::Composition is only '+s.toFixed(2)+' s. Audio/inputs were probably not read.');process.exit(1);}" | tee -a "$GITHUB_STEP_SUMMARY"

          N="$(node -p "require('./plan.json').n")"
          MAXS="${MAX_SHARDS:-20}"
          case "$MAXS" in ''|*[!0-9]*) MAXS=20;; esac
          [ "$MAXS" -lt 1 ] && MAXS=1
          [ "$MAXS" -gt 20 ] && MAXS=20
          S=$(( N < MAXS ? N : MAXS ))
          LIST="$(python3 -c "import json;print(json.dumps(list(range($S))))")"
          echo "Parallel jobs: $S"
          echo "shards=$LIST" >> "$GITHUB_OUTPUT"

      - name: Save node_modules cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: project/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('project/package.json') }}

      - name: Stage project (without node_modules)
        run: |
          mkdir proj_art
          rsync -a --exclude node_modules --exclude chunks project/ proj_art/
          ls -la proj_art

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: project
          path: proj_art
          retention-days: 3
          overwrite: true

  render:
    needs: prep
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: project
          path: project

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          path: project/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('project/package.json') }}

      - name: Install dependencies (cache miss)
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: project
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Restore chunks from an earlier attempt
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: chunks-${{ matrix.shard }}
          path: project/chunks

      - name: Render this shard
        working-directory: project
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: node shard.js

      - name: Upload chunks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunks-${{ matrix.shard }}
          path: project/chunks
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
          overwrite: true

  join:
    needs: [prep, render]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Download project
        uses: actions/download-artifact@v4
        with:
          name: project
          path: project

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          path: project/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('project/package.json') }}

      - name: Install dependencies (cache miss)
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: project
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunks-*
          merge-multiple: true
          path: project/chunks

      - name: Verify chunks
        working-directory: project
        run: |
          N="$(node -p "require('./plan.json').n")"
          F="$(ls chunks/part_*.mp4 2>/dev/null | wc -l)"
          echo "Chunks: $F of $N"
          if [ "$F" -ne "$N" ]; then
            echo "::error::Missing chunks ($F of $N). Use 'Re-run failed jobs' on this run."
            exit 1
          fi

      - name: Render audio track
        working-directory: project
        run: node audio.js

      - name: Join chunks with audio
        working-directory: project
        run: |
          for f in $(ls chunks/part_*.mp4 | sort); do echo "file '$PWD/$f'"; done > list.txt
          FPS="$(node -p "require('./plan.json').fps")"
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -i audio.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest "video_${FPS}fps.mp4"
          ls -l video_*.mp4

      - name: Check final video
        working-directory: project
        run: |
          F="$(ls video_*fps.mp4 | sed -n '1p')"
          V="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F")"
          E="$(node -p "(require('./plan.json').total/require('./plan.json').fps).toFixed(2)")"
          echo "Video: $V s | expected: $E s" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v v="$V" -v e="$E" 'BEGIN{d=v-e; if(d<0)d=-d; if(d>0.5){print "ERROR: video length differs from the composition"; exit 1}}'

      - name: Upload final video (zip)
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: project/video_*fps.mp4
          retention-days: 14
          compression-level: 0
          overwrite: true
